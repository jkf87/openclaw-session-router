--surface:#0e1015;--card:#161920;--elevated:#191c24;
--text:#d4d4d8;--text-strong:#f4f4f5;--muted:#8b8b94;
--border:#1e2028;--border-strong:#2e3040;
--accent:#ff5c5c;--accent-fill:#d13c3c;--accent-fg:#ffffff;
--ok:#22c55e;--warn:#f59e0b;--danger:#ef4444;--info:#3b82f6}}

h1,h2,h3{margin:0 0 8px;color:var(--text-strong);font-weight:600}
h1{font-size:18px}h2{font-size:16px}h3{font-size:14px}
p{margin:0 0 8px}
a{color:var(--accent)}

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Router</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0b0e14;--panel:#121722;--panel2:#161d2b;--line:#232c3f;
    --text:#dce3f0;--muted:#8b96ab;--faint:#5c6678;
    --accent:#7c6cff;--accent2:#a89bff;--ok:#4dd88a;--warn:#ffb454;--danger:#ff6b7a;--jev:#4dd8e0;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo',sans-serif;font-size:13px;line-height:1.5;padding:14px}
  .hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .hdr h1{font-size:15px;font-weight:700;flex:1}
  .hdr .cnt{font-family:var(--mono);font-size:11px;color:var(--faint)}
  button{font-family:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);padding:5px 10px;font-size:12px}
  button:hover{color:var(--text);border-color:#33405c}
  .mode{display:flex;gap:6px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
  .modebtn{padding:6px 14px;border-radius:99px;font-weight:600;font-size:12.5px}
  .modebtn.on-manual{border-color:var(--accent);color:var(--accent2);background:#1a1730}
  .modebtn.on-jev{border-color:var(--jev);color:var(--jev);background:#0f2426}
  .modehint{font-size:11px;color:var(--faint);flex:1;min-width:180px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .chip{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
  .chip.on{border-color:var(--accent);color:var(--accent2);background:#1a1730}
  .search{width:100%;background:#0e1420;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px 10px;font-size:12.5px;margin-bottom:8px;font-family:inherit}
  .search:focus{outline:none;border-color:#3a4a6b}
  .list{border:1px solid var(--line);border-radius:10px;background:var(--panel);max-height:220px;overflow-y:auto;margin-bottom:10px}
  .row{display:flex;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid #1a2130;cursor:pointer}
  .row:last-child{border-bottom:none}
  .row:hover{background:var(--panel2)}
  .row.sel{background:#1a1730;box-shadow:inset 3px 0 0 var(--accent)}
  .row .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:0 0 7px}
  .row .dot.live{background:var(--ok)}
  .row .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .lbl b{font-weight:600}
  .row .lbl .ag{font-family:var(--mono);font-size:10px;color:var(--accent2);margin-left:6px}
  .row .badge{font-family:var(--mono);font-size:10px;color:var(--jev);border:1px solid #1e4a4e;background:#0f2426;border-radius:99px;padding:1px 7px;white-space:nowrap}
  .row .key{font-family:var(--mono);font-size:10px;color:var(--faint);white-space:nowrap}
  .target{display:flex;gap:8px;align-items:center;background:#1a1730;border:1px solid #3a3568;border-radius:8px;padding:7px 10px;margin-bottom:8px;font-size:12px;min-height:34px}
  .target.jevmode{background:#0f2426;border-color:#1e4a4e}
  .target .t-lbl{color:var(--muted);font-family:var(--mono);font-size:10px}
  .target .t-val{flex:1;font-family:var(--mono);font-size:11px;color:var(--accent2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .target.jevmode .t-val{color:var(--jev)}
  textarea{width:100%;background:#0e1420;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font-size:12.5px;font-family:inherit;resize:vertical;min-height:56px;margin-bottom:8px}
  textarea:focus{outline:none;border-color:#3a4a6b}
  .sendbar{display:flex;gap:8px;align-items:center}
  .send{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;padding:7px 18px}
  .send.jev{background:#0f2426;border-color:var(--jev);color:var(--jev)}
  .send:hover{filter:brightness(1.15)}
  .send:disabled{opacity:.4;cursor:not-allowed;filter:none}
  .status{font-family:var(--mono);font-size:11px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .status.ok{color:var(--ok)} .status.err{color:var(--danger)} .status.busy{color:var(--warn)} .status.jev{color:var(--jev)}
  .log{margin-top:10px;font-family:var(--mono);font-size:10.5px;color:var(--faint);max-height:100px;overflow-y:auto}
  .log div{padding:2px 0;border-bottom:1px dashed #1a2130}
  .log .ok{color:var(--ok)} .log .err{color:var(--danger)} .log .jev{color:var(--jev)}
  .empty{padding:18px;text-align:center;color:var(--faint);font-size:12px}
</style>
</head>
<body>
<div class="hdr">
  <h1>🎛 Session Router</h1>
  <span class="cnt" id="cnt">…</span>
  <button id="refresh" title="새로고침">↻</button>
</div>
<div class="mode">
  <button class="modebtn" id="modeManual">🖐 수동 선택</button>
  <button class="modebtn" id="modeJev">🤖 Jev 자동</button>
  <span class="modehint" id="modeHint">세션을 직접 골라 전송</span>
</div>
<div class="chips" id="chips"></div>
<input class="search" id="search" placeholder="세션 검색 — 라벨 · 에이전트 · 키">
<div class="list" id="list"><div class="empty">세션 목록 로딩 중…</div></div>
<div class="target" id="targetBox"><span class="t-lbl" id="tlbl">TO →</span><span class="t-val" id="tval">대상 미선택</span></div>
<textarea id="msg" placeholder="메시지… (Jev 자동 모드에서는 목적지 없이 그냥 쓰세요)"></textarea>
<div class="sendbar">
  <button class="send" id="send" disabled>전송 ➤</button>
  <span class="status" id="status"></span>
</div>
<div class="log" id="log"></div>
<script>
(function(){
  var sessions=[], agents=[], agentFilter=null, selected=null, timer=null;
  var mode="manual";               // "manual" | "jev"
  var suggestion=null;             // {sessionKey, probability, determined} from last needs_pick
  var $=function(id){return document.getElementById(id)};
  function setStatus(text, cls){ var s=$("status"); s.textContent=text||""; s.className="status "+(cls||""); }
  function logLine(text, cls){
    var d=document.createElement("div"); d.className=cls||"";
    d.textContent=new Date().toLocaleTimeString("ko-KR",{hour12:false})+" "+text;
    var l=$("log"); l.prepend(d); while(l.children.length>6) l.removeChild(l.lastChild);
  }
  function labelOf(key){ var s=sessions.find(function(x){return x.key===key}); return s?s.label:key; }
  function normSessions(data){
    var rows=(data&&typeof data==="object")?(data.sessions||data.rows||data.items||[]):(Array.isArray(data)?data:[]);
    return rows.map(function(s){
      var key=s.sessionKey||s.key||s.session_key||"";
      return {
        key:key,
        label:(s.label||s.title||s.derivedTitle||s.displayName||key.split(":").slice(-1)[0]||key),
        agent:s.agentId||s.agent||"",
        live:!!(s.active||s.live||s.running),
        activity:s.lastActivityAt||s.lastActivity||s.updatedAt||s.updated_at||""
      };
    }).filter(function(s){return s.key});
  }
  function render(){
    var q=$("search").value.trim().toLowerCase();
    var rows=sessions.filter(function(s){
      if(agentFilter&&s.agent!==agentFilter) return false;
      if(!q) return true;
      return (s.label+" "+s.agent+" "+s.key).toLowerCase().indexOf(q)>=0;
    }).slice(0,80);
    var el=$("list"); el.innerHTML="";
    if(!rows.length){ el.innerHTML='<div class="empty">조건에 맞는 세션 없음</div>'; }
    rows.forEach(function(s){
      var d=document.createElement("div"); d.className="row"+(selected===s.key?" sel":"");
      var isSugg=suggestion&&suggestion.sessionKey===s.key;
      var act=s.activity?String(s.activity).replace("T"," ").slice(0,16):"";
      d.innerHTML='<span class="dot'+(s.live?" live":"")+'"></span><span class="lbl"><b></b>'+(s.agent?'<span class="ag"></span>':"")+'</span>'+(isSugg?'<span class="badge"></span>':"")+'<span class="key"></span>';
      d.querySelector("b").textContent=s.label;
      if(s.agent) d.querySelector(".ag").textContent=s.agent;
      if(isSugg) d.querySelector(".badge").textContent="Jev 제안 p="+(suggestion.probability??0).toFixed(2);
      d.querySelector(".key").textContent=act;
      d.title=s.key;
      d.onclick=function(){ selected=(selected===s.key)?null:s.key; syncTarget(); render(); };
      el.appendChild(d);
    });
    $("cnt").textContent=sessions.length+" 세션";
    syncSend();
  }
  function candidatesPayload(){
    var list=sessions.slice();
    list.sort(function(a,b){ return String(b.activity||"").localeCompare(String(a.activity||"")); });
    return list.slice(0,20).map(function(s){
      return {sessionKey:s.key, label:String(s.label).slice(0,160), agentId:s.agent||undefined, activity:s.activity?String(s.activity).slice(0,32):undefined};
    });
  }
  function syncTarget(){
    var box=$("targetBox"), lbl=$("tlbl"), t=$("tval");
    if(mode==="jev"){
      box.className="target jevmode"; lbl.textContent="Jev →";
      t.textContent="메시지 내용이 목적지를 결정 (p≥0.5 자동, 미만이면 클릭 확정)";
    } else {
      box.className="target"; lbl.textContent="TO →";
      if(selected){ t.textContent=labelOf(selected)+"  "+selected; }
      else if(agentFilter){ t.textContent="에이전트 "+agentFilter+" 주세션"; }
      else t.textContent="대상 미선택";
    }
    syncSend();
  }
  function syncSend(){
    var btn=$("send");
    btn.className="send"+(mode==="jev"?" jev":"");
    btn.textContent=mode==="jev"?"자동 판정 ➤":"전송 ➤";
    var msg=$("msg").value.trim();
    if(mode==="jev") btn.disabled=!msg;
    else btn.disabled=!(msg&&(selected||agentFilter));
  }
  function renderChips(){
    var c=$("chips"); c.innerHTML="";
    if(mode==="jev"){ c.style.display="none"; return; }
    c.style.display="flex";
    var all=document.createElement("span"); all.className="chip"+(agentFilter?"":" on");
    all.textContent="전체"; all.onclick=function(){agentFilter=null;selected=null;syncTarget();render();renderChips();};
    c.appendChild(all);
    agents.forEach(function(a){
      var id=a.id||a.agentId||""; if(!id) return;
      var d=document.createElement("span"); d.className="chip"+(agentFilter===id?" on":"");
      d.textContent=id+(a.model?(" · "+a.model):"");
      d.onclick=function(){agentFilter=(agentFilter===id)?null:id;selected=null;syncTarget();render();renderChips();};
      c.appendChild(d);
    });
  }
  function setMode(next){
    mode=next; suggestion=null;
    $("modeManual").className="modebtn"+(mode==="manual"?" on-manual":"");
    $("modeJev").className="modebtn"+(mode==="jev"?" on-jev":"");
    $("modeHint").textContent=mode==="jev"?"Jev가 목적지 판정 — 미만 확신은 클릭으로 확정":"세션을 직접 골라 전송";
    renderChips(); syncTarget(); render();
  }
  function load(){
    setStatus("동기화 중…","busy");
    var jobs=[openclaw.data.read("sessions.list").then(normSessions).catch(function(e){setStatus("sessions.list 실패: "+e,"err");return null})];
    jobs.push(openclaw.data.read("agents.list").then(function(data){
      var rows=(data&&typeof data==="object")?(data.agents||data.rows||data.items||[]):(Array.isArray(data)?data:[]);
      agents=rows.map(function(a){return {id:a.id||a.agentId||"",model:a.model||""}}).filter(function(a){return a.id});
    }).catch(function(){agents=[]}));
    return Promise.all(jobs).then(function(res){
      if(res[0]){ sessions=res[0]; setStatus("동기화 완료 "+new Date().toLocaleTimeString("ko-KR",{hour12:false}),"ok"); }
      render();
    });
  }
  function manualParams(message){
    var params={message:message};
    if(selected){ params.sessionKey=selected; } else if(agentFilter){ params.agentId=agentFilter; }
    if(suggestion){ params.feedback={suggestion:suggestion.sessionKey, probability:suggestion.probability, determined:suggestion.determined}; }
    return params;
  }
  $("refresh").onclick=function(){ suggestion=null; load(); };
  $("search").oninput=render;
  $("msg").oninput=syncSend;
  $("modeManual").onclick=function(){ setMode("manual"); };
  $("modeJev").onclick=function(){ setMode("jev"); };
  $("send").onclick=function(){
    var message=$("msg").value.trim(); if(!message) return;
    if(mode==="jev"){
      setStatus("Jev 판정 중…","busy"); $("send").disabled=true; suggestion=null; render();
      openclaw.action.run("session-router.auto-route",{message:message,candidates:candidatesPayload()}).then(function(r){
        var res=(r&&typeof r==="object")?r:{};
        if(res.status==="routed"){
          suggestion=null; selected=null;
          setStatus("✓ Jev → "+labelOf(res.sessionKey)+" (p="+(res.probability??0).toFixed(2)+")","jev");
          logLine("🤖 "+labelOf(res.sessionKey)+" p="+(res.probability??0).toFixed(2)+" : "+message.slice(0,36)+(message.length>36?"…":""),"jev");
          $("msg").value=""; syncTarget(); render();
        } else if(res.status==="needs_pick"){
          suggestion={sessionKey:res.suggestion,probability:res.probability,determined:res.determined};
          setStatus(res.suggestion?("제안: "+labelOf(res.suggestion)+" (p="+(res.probability??0).toFixed(2)+") — 전송 눌러 확정"):"Jev 확신 낮음 — 직접 선택","busy");
          logLine("🤖 제안 "+(res.suggestion?labelOf(res.suggestion):"ask_user")+" p="+(res.probability??0).toFixed(2),"jev");
          setMode("manual");
          if(suggestion.sessionKey) selected=suggestion.sessionKey;
        } else if(res.status==="jev_unavailable"){
          setStatus("Jev 불가("+String(res.reason||"").slice(0,40)+") — 수동 선택","err");
          setMode("manual");
        } else {
          setStatus("응답: "+JSON.stringify(res).slice(0,80),"err");
        }
      }).catch(function(e){
        setStatus("자동 라우팅 실패: "+e,"err");
        logLine("✗ auto: "+String(e).slice(0,60),"err");
      }).then(function(){ syncSend(); });
    } else {
      var params=manualParams(message);
      setStatus("전송 중…","busy"); $("send").disabled=true;
      openclaw.action.run("session-router.route",params).then(function(r){
        var res=(r&&typeof r==="object")?r:(r?{status:String(r)}:{});
        setStatus("✓ 접수됨 — "+(res.sessionKey||("agent:"+res.agentId)),"ok");
        logLine((suggestion?"🤖확정 ":"→ ")+(res.sessionKey||("agent:"+res.agentId))+" : "+message.slice(0,36)+(message.length>36?"…":""), suggestion?"jev":"ok");
        $("msg").value=""; suggestion=null; syncTarget(); render();
      }).catch(function(e){
        setStatus("전송 실패: "+e,"err");
        logLine("✗ "+String(e).slice(0,80),"err");
      }).then(function(){ syncSend(); });
    }
  };
  setMode("manual");
  load(); if(timer) clearInterval(timer); timer=setInterval(load,60000);
})();
</script>
</body>
</html></body></html>
